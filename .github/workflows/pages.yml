name: Build and deploy Kebab Rush

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Smoke test
        run: npm test

      - name: Configure cloud API
        env:
          API_URL: ${{ vars.KEBAB_RUSH_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if (process.env.API_URL) {
            const url = new URL(process.env.API_URL);
            if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) throw new Error('KEBAB_RUSH_API_URL must be an HTTPS origin');
            const response = await fetch(new URL('/health', url), { headers: { Origin: 'https://ikhwamnordin.github.io' }, signal: AbortSignal.timeout(15000) });
            if (!response.ok || (await response.json()).ok !== true || response.headers.get('access-control-allow-origin') !== 'https://ikhwamnordin.github.io') throw new Error('Cloud API health/CORS check failed');
            const html = fs.readFileSync('index.html', 'utf8');
            const tag = /<meta name="kebab-rush-api" content="[^"]*">/;
            if (!tag.test(html)) throw new Error('API meta tag missing');
            fs.writeFileSync('index.html', html.replace(tag, `<meta name="kebab-rush-api" content="${url.origin}">`));
          }
          NODE

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
